# Ruff configuration for the Django backend.

# Auto-generated by makemigrations, not hand-maintained — not worth linting.
exclude = ["core/migrations"]

[lint]
# RUF012 (mutable-class-default): false positive for Django/DRF, where list/
# tuple class attributes are the standard idiomatic pattern (Meta.fields,
# permission_classes, list_display, ...) and are never mutated per-instance
# the way the rule assumes for plain dataclass-style code.
#
# C408 (unnecessary dict()/list() call): left as a deliberate style choice —
# seed.py's aligned dict(...) table of menu items reads more clearly as calls
# than as literal dicts.
ignore = ["RUF012", "C408"]
