[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
    "pip install -r backend/requirements.txt",
    "npm --prefix frontend install"
]

[phases.build]
cmds = [
    "npm --prefix frontend run build",
    "python backend/manage.py collectstatic --noinput"
]

[start]
cmd = "bash start.sh"
